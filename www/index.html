<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salman ISP</title>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#fdf2f8 0%,#f8fafc 30%,#f8fafc 100%);background-attachment:fixed;color:#0f172a;margin:0;padding:0}
.wrap{max-width:880px;margin:0 auto;padding:10px 10px 24px}
.app-header{background:linear-gradient(135deg,#ec4899 0%,#7c3aed 52%,#2563eb 100%);color:#fff;border-radius:16px;padding:12px 14px;margin:8px 0 12px;box-shadow:0 14px 30px rgba(2,6,23,.28);display:flex;align-items:center;gap:16px;border-bottom:4px solid #f59e0b}
.app-header h1{font-size:22px;margin:0 0 4px;letter-spacing:.3px}
.app-header p{margin:0;opacity:.93;font-size:12.5px;line-height:1.4}
.owner-photo{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #f59e0b;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.card{background:#ffffff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 6px 20px rgba(219,39,119,.10);border:1px solid #e2e8f0}
h2{font-size:21px;margin:4px 0 10px;color:#0f172a} h3{font-size:17px;margin:14px 0 6px;color:#6d28d9}
input,select{font-size:16px;padding:12px 13px;border-radius:12px;border:1px solid #dbe4f0;width:100%;margin:6px 0;background:#ffffff}
input:focus,select:focus{outline:2px solid #2563eb;border-color:#2563eb}
button{background:linear-gradient(135deg,#ec4899,#6366f1);color:#fff;border:none;cursor:pointer;font-weight:700;font-size:15px;padding:12px 14px;border-radius:12px;width:100%;margin:6px 0;box-shadow:0 4px 12px rgba(37,99,235,.22)}
button:hover{filter:brightness(1.08)}
button.secondary{background:#eef2f7;color:#0f172a;box-shadow:none;border:1px solid #dbe4f0} button.danger{background:#dc2626;box-shadow:none} button.wa{background:linear-gradient(135deg,#16a34a,#22c55e)}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
.green{background:#dcfce7;color:#166534} .yellow{background:#fef3c7;color:#92400e} .red{background:#fee2e2;color:#991b1b} .grey{background:#e2e8f0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;background:#ffffff;border:1px solid #e2e8f0;border-radius:999px;padding:6px;box-shadow:0 3px 12px rgba(15,23,42,.06)}
.tabs button{width:auto;padding:10px 15px;border-radius:999px;background:#eef2f7;color:#0f172a;box-shadow:none;margin:0;border:1px solid transparent}
.tabs button:hover{background:#1e3a8a;color:#fff}
.small{font-size:13.5px;color:#475569;line-height:1.55} .big{font-size:24px;font-weight:800;color:#0f172a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:8px}} .dash-compact .card{padding:10px} .dash-compact h2{font-size:18px} .dash-compact .step-box{display:none}
.hidden{display:none} label{font-weight:700;font-size:14px;color:#334155}
#custList .card{border-left:5px solid #2563eb}
#dashGrid .card{border-top:4px solid #e2e8f0}
.num-badge{display:inline-block;min-width:32px;text-align:center;background:#1e3a8a;color:#fff;border-radius:999px;padding:4px 8px;font-weight:800;font-size:14px;margin-right:8px}
.step-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:14px;margin:12px 0;line-height:1.7}
.section-head{border-bottom:2px solid #e2e8f0;padding-bottom:8px;margin-bottom:10px}
.cust-line{margin:4px 0}
.wrap{padding-bottom:170px}
.khata-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:13px 14px;margin:9px 0;box-shadow:0 2px 10px rgba(15,23,42,.06);border:1px solid #eef2f7;cursor:pointer}
.avatar{width:48px;height:48px;min-width:48px;border-radius:13px;background:linear-gradient(135deg,#fbcfe8,#c7d2fe);display:flex;align-items:center;justify-content:center;font-weight:800;color:#831843;font-size:15px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:10px 6px 16px;z-index:100;box-shadow:0 -4px 16px rgba(15,23,42,.08)}
.bottom-nav button{background:none;color:#64748b;box-shadow:none;width:auto;font-size:12.5px;padding:8px 6px;margin:0;border:none}
.bottom-nav button.active{color:#db2777;font-weight:800}
.add-fab{position:fixed;bottom:72px;left:14px;right:14px;max-width:852px;margin:0 auto;background:#000 !important;color:#fff !important;border-radius:16px;padding:16px;font-size:17px;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu-dropdown{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px;margin-top:10px;position:sticky;top:8px;z-index:50;box-shadow:0 10px 24px rgba(2,6,23,.18)}
.menu-dropdown button{background:#fff;color:#0f172a;box-shadow:none;border:1px solid #e2e8f0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
